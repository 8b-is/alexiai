    <circle cx="265" cy="368" r="5"/>
    <circle cx="430" cy="420" r="4"/>
    <circle cx="565" cy="300" r="6"/>
    <circle cx="742" cy="352" r="5"/>
    <circle cx="905" cy="262" r="4"/>
    <circle cx="1080" cy="330" r="5"/>
    <circle cx="430" cy="240" r="4"/>
    <circle cx="905" cy="430" r="4"/>
    <circle cx="742" cy="470" r="4"/>
    <circle cx="1080" cy="470" r="4"/>
