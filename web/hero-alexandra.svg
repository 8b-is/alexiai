        font-size="118" font-weight="800" letter-spacing="10" fill="url(#word)">ALEXANDRA</text>

  <text x="600" y="500" text-anchor="middle"
        font-family="ui-monospace, SF Mono, Menlo, monospace"
        font-size="30" letter-spacing="14" fill="#ff5c8a">DRA&lt;3 · OMNI EDITION</text>

  <text x="600" y="548" text-anchor="middle"
        font-family="ui-monospace, SF Mono, Menlo, monospace"
        font-size="22" letter-spacing="6" fill="#7a8299">from .p — women · amazons · legends of LLL</text>

  <text x="600" y="588" text-anchor="middle"
        font-family="ui-monospace, SF Mono, Menlo, monospace"
        font-size="17" letter-spacing="4" fill="#4c5570">life long learning · life itself · love, life, longevity of graphs · karma</text>

  <!-- corner sigil -->
  <g transform="translate(52 52)" fill="none" stroke="#3d4a75" stroke-width="2">
    <path d="M 0 20 L 10 0 L 20 20 Z"/>
    <path d="M 10 0 L 10 34"/>
    <circle cx="10" cy="42" r="3" fill="#ff5c8a" stroke="none"/>
  </g>
