  <g fill="#ff5c8a">
    <circle cx="565" cy="300" r="2.2"/>
    <circle cx="742" cy="352" r="2"/>
    <circle cx="430" cy="240" r="2"/>
  </g>

  <!-- the aura behind the name -->
  <ellipse cx="600" cy="300" rx="430" ry="230" fill="url(#aura)"/>

  <!-- the diadem: an amazon crown of ten diamonds -->
  <g fill="none" stroke="url(#gold)" stroke-width="3" stroke-linejoin="round">
    <path d="M 380 352 L 420 312 L 460 352 L 500 306 L 540 352 L 580 300 L 620 352 L 660 296 L 700 352 L 740 306 L 780 352 L 820 312 L 860 352"/>
  </g>
  <g fill="url(#gold)">
    <path d="M 420 312 l 18 -18 l 18 18 z" opacity=".9"/>
    <path d="M 500 306 l 18 -18 l 18 18 z" opacity=".8"/>
    <path d="M 580 300 l 18 -18 l 18 18 z" opacity="1"/>
    <path d="M 660 296 l 18 -18 l 18 18 z" opacity="1"/>
    <path d="M 740 306 l 18 -18 l 18 18 z" opacity=".8"/>
    <path d="M 380 352 l 18 -18 l 18 18 z" opacity=".7"/>
    <path d="M 820 312 l 18 -18 l 18 18 z" opacity=".7"/>
  </g>

  <!-- the φ: golden ratio spiral at the crown's centre -->
  <g transform="translate(600 208) scale(1.04)" fill="none" stroke="url(#gold)" stroke-width="4" stroke-linecap="round">
    <path d="M 0 0 C 34 -6 62 16 58 50 C 54 86 22 110 -14 106 C -52 102 -80 74 -76 40 C -72 8 -40 -10 -8 2 C 16 11 30 34 27 55 C 24 76 8 88 -12 87"/>
  </g>

  <!-- wordmark -->
  <text x="600" y="452" text-anchor="middle"
