name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The app: Node stdlib only, no dependencies to install, no actions to pull.
  # Proven on both platforms — 100% Linux + macOS is a CI fact, not a claim.
  js:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: node tests (zero deps, stdlib only)
        run: node --test test/*.test.js
      - name: cli smoke
        run: node src/cli.js gaia "hello" && node src/cli.js bench --dim 64

  # The substrate: zero-unsafe, zero-alloc, no_std-capable Rust.
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: rust tests (zero unsafe, zero alloc — both pinned by tests)
        run: cargo test --manifest-path rust/Cargo.toml
      - name: core-only build (no_std, no default features)
        run: cargo build --manifest-path rust/Cargo.toml --no-default-features
      - name: release bench smoke
        run: cargo run --release --manifest-path rust/Cargo.toml --example bench -- --dim 256
