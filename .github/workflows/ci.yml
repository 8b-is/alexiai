name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The app + the core: one static binary, zero unsafe, zero alloc (pinned by
  # the counting allocator test). Proven on both platforms.
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: rust tests
        run: cargo test --workspace --manifest-path rust/Cargo.toml
      - name: core-only build (no_std, no default features)
        run: cargo build --manifest-path rust/gaia-mlx-quant/Cargo.toml --no-default-features
      - name: release smoke
        run: cargo run --release --manifest-path rust/Cargo.toml -p alexiai -- gaia "hello"

  # The Go glue and kernel: stdlib only, vet clean.
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: go vet + test
        run: |
          go vet ./...
          go test ./...
        working-directory: go

  # C99 + platform assembly, proven against the portable C reference.
  c:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: make test
        run: make -C c test
