[package]
name = "gaia-mlx-quant"
version = "0.1.0"
edition = "2024"
description = "GAIA-MLX-QUANT substrate — the zero-allocation, zero-unsafe ternary b1.58 kernel in pure core Rust"
license = "MIT"
repository = "https://github.com/8b-is/alexiai"
authors = ["Peter Lodri <peter@vaked.dev>", "the 8b-is constellation"]

[lib]
name = "gaia_mlx_quant"

[features]
default = ["std"]
std = []

[dependencies]

[dev-dependencies]

[[example]]
name = "bench"
path = "examples/bench.rs"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"
